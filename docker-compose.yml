services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: labantonazure.azurecr.io/eclipseboard-backend:latest
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: labantonazure.azurecr.io/eclipseboard-frontend:latest
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend